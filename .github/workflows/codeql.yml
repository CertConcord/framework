name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-24.04
            build: none
          - language: actions
            os: ubuntu-24.04
            build: none
          - language: java-kotlin
            os: ubuntu-24.04
            build: manual
          - language: swift
            os: macos-15
            build: manual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        if: matrix.language == 'java-kotlin'
        with:
          cache-provider: basic
          gradle-version: '9.6.0'
      - if: matrix.language == 'java-kotlin'
        run: gradle --project-dir reference/native/android assembleDebug --no-daemon
      - if: matrix.language == 'swift'
        run: |
          swiftc reference/native/apple/AppleSecureEnclave.swift reference/native/apple/main.swift -o "$RUNNER_TEMP/certconcord-holder"
          xcodebuild -project reference/native/apple/CertConcordHolder.xcodeproj -target CertConcordHolder -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:${{ matrix.language }}
