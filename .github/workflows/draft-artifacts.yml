name: Draft review artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'VeriCommons/certconcord'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run sdk:build
      - run: npm run sdk:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: certconcord-draft-review
          path: |
            draft.json
            draft-manifest.json
            reference/dist/*.tgz
            reference/dist/sdk/sbom.cdx.json
          retention-days: 30
