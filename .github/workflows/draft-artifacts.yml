name: Draft review artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'CertConcord/framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run sdk:build
      - run: npm run sdk:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: certconcord-draft-review
          path: |
            draft.json
            draft-manifest.json
            reference/dist/*.tgz
            reference/dist/sdk/sbom.cdx.json
          retention-days: 30
