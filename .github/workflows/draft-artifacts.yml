name: Draft review artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'CertConcord/framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run sdk:build
      - run: npm run sdk:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: certconcord-draft-review
          path: |
            draft.json
            draft-manifest.json
            reference/dist/*.tgz
            reference/dist/sdk/sbom.cdx.json
          retention-days: 30
