name: Draft reference acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Build pinned independent OpenSSL
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz -o "$RUNNER_TEMP/openssl.tar.gz"
          echo 'a2157c2830efdec3788939b00c9b0638306d3f0bbb76dc4832ee503bb397df98  '"$RUNNER_TEMP/openssl.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openssl.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-3.6.5"
          ./Configure --prefix="$RUNNER_TEMP/certconcord-openssl" --openssldir="$RUNNER_TEMP/certconcord-openssl/ssl" no-shared no-tests
          make -j2
          make install_sw install_ssldirs
          echo "OPENSSL_BIN=$RUNNER_TEMP/certconcord-openssl/bin/openssl" >> "$GITHUB_ENV"
          echo "OPENSSL_CONF=$RUNNER_TEMP/certconcord-openssl/ssl/openssl.cnf" >> "$GITHUB_ENV"
          echo 'CERTCONCORD_REQUIRE_OPENSSL=1' >> "$GITHUB_ENV"
          echo 'CERTCONCORD_REQUIRE_CMS_KEM=1' >> "$GITHUB_ENV"
      - name: Replay pinned BC 1.86 ERS compatibility boundary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bc-1.86"
          node --input-type=module -e 'import fs from "node:fs"; for (const d of JSON.parse(fs.readFileSync("tools/ers-bc186/dependencies.json"))) console.log(d.url + " " + d.file)' | while read -r url file; do
            curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/bc-1.86/$file"
          done
          node tools/ers-bc186/replay.mjs "$RUNNER_TEMP/bc-1.86"
      - run: npm test
      - run: node fuzz/differential.mjs
        working-directory: reference
      - run: npm run check
      - run: npm run demo
      - run: npm run demo -- --direct
      - run: npm run demo -- --device-key --direct --annex-c
      - run: npm run demo:mtc
      - run: npm run demo:mtc -- --passkey
      - run: npm run demo:mtc -- --passkey --trusted-time
      - run: npm run demo -- --identity=custom --passkey --trusted-time
      - run: npm run demo:document
      - run: npm run demo -- --identity=photoid
      - run: npm run demo -- --identity=pid --direct --device-key --passkey
      - run: npm run demo:passkey -- --v4 --split --mtc
      - run: npm run demo -- --identity=pid --raw-passkey --arkg
      - run: npm run demo -- --identity=custom --raw-passkey --direct --annex-c
      - name: Real PKCS 11 ABI
        run: |
          sudo apt-get update
          sudo apt-get install --yes softhsm2 swtpm tpm2-tools
          cd reference
          node hardware-check.mjs
          node tpm-simulator-check.mjs
  apple:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build macOS Secure Enclave provider
        run: swiftc reference/native/apple/AppleSecureEnclave.swift reference/native/apple/main.swift -o "$RUNNER_TEMP/certconcord-holder"
      - name: Build iOS holder application
        run: xcodebuild -project reference/native/apple/CertConcordHolder.xcodeproj -target CertConcordHolder -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          gradle-version: '9.6.0'
      - run: gradle --project-dir reference/native/android assembleDebug
