name: Optional agreement review
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional PR number for explicitly selected DCO/CLA review against main
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  review-contributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - run: node reference/governance/github-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CERTCONCORD_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          CERTCONCORD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CERTCONCORD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
