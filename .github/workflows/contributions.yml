name: Optional agreement review
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional PR number for explicitly selected DCO/CLA review against main
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  review-contributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - run: node reference/governance/github-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CERTCONCORD_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          CERTCONCORD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CERTCONCORD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
